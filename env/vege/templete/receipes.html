{% extends "base.html" %}
{% block start %}

<div class="card shadow-lg p-4 mb-4">
    <h2>Add Recipe</h2>
    <hr>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input name="receipe_name" required class="form-control mb-3" placeholder="Recipe name">
        <textarea name="receipe_desc" required class="form-control mb-3" placeholder="Recipe description"></textarea>
        <input type="file" name="receipe_image" class="form-control mb-3">
        <button class="btn btn-success w-100">Add Recipe</button>
    </form>
</div>


<!-- SEARCH -->
<div class="mb-3">
    <form>
        <h4>Search Food</h4>
        <input name="search" class="form-control" placeholder="Search recipes...">
        <button class="btn btn-primary mt-2">Search</button>
    </form>
</div>


<!-- TABLE -->
<table class="table table-bordered bg-white shadow">
    <tr>
        <th>#</th>
        <th>Recipe name</th>
        <th>Recipe Desc</th>
        <th>Image</th>
        <th>Actions</th>
    </tr>

    {% for receipe in receipes %}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{receipe.receipe_name}}</td>
        <td>{{receipe.receipe_desc}}</td>

        <td>
            <img src="/media/{{receipe.receipe_image}}" style="height:80px">
        </td>

        <td>
            <a href="/delete/{{receipe.id}}" class="btn btn-danger">Delete</a>
            <a href="/update/{{receipe.id}}" class="btn btn-success">Update</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
