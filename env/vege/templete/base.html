<!DOCTYPE html>
<html>
<head>
    <title>Recipe App</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f7fb;">
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'receipes' %}">Recipe App</a>
            <div>
                {% if user.is_authenticated %}
                    <a href="{% url 'students' %}" class="btn btn-outline-secondary btn-sm me-2">Students</a>
                    <a href="{% url 'department_create' %}" class="btn btn-outline-secondary btn-sm me-2">Departments</a>
                    <span class="me-3">Hello, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        {% block start %}{% endblock %}
    </div>
</body>
</html>
